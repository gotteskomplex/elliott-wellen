[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elliott-wellen"
version = "0.1.0"
description = "Automatische Elliott-Wellen-Zählung mit Szenarien, Scoring, Kurszielen und Invalidierungs-Levels"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "plotly>=5.18",
    "typer>=0.9",
    "yfinance>=0.2.40",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
elliott = "elliott.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
elliott = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
    "benchmark: Performance-Test (2.000 Kerzen / ~60 Pivots < 10 s)",
]
filterwarnings = [
    "ignore::DeprecationWarning:yfinance.*",
]
